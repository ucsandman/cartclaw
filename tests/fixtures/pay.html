<!doctype html>
<!-- Shape of Amazon's checkout payment page (/checkout/p/<id>/pay), rebuilt by hand with fake cards. -->
<html><head><title>Place Your Order - Amazon Checkout</title></head><body>
<form method="post" action="/checkout/p/p-000-0000000-0000000/pay">
<div class="a-box-inner a-padding-small"><div class="a-fixed-left-grid"><div class="a-fixed-left-grid-inner"><div class="a-fixed-left-grid-col a-col-left">
<span class="pmts-instrument-selector"><div class="a-radio" data-a-input-name="ppw-instrumentRowSelection"><label for="pp-x-1"><input id="pp-x-1" name="ppw-instrumentRowSelection" type="radio" value="instrumentId=FAKE1&amp;isExpired=false&amp;paymentMethod=CC&amp;tfxEligible=false"/><i class="a-icon a-icon-radio"></i><span class="a-label a-radio-label"><span class="pmts-radio-label_hidden_text">Visa ending in 0000</span></span></label></div></span>
</div><div class="a-fixed-left-grid-col a-col-right">Example Bank Debit Card ending in 0000 Pat Example 11/2030</div></div></div></div>
<div class="a-box-inner a-padding-small"><div class="a-fixed-left-grid"><div class="a-fixed-left-grid-inner"><div class="a-fixed-left-grid-col a-col-left">
<span class="pmts-instrument-selector"><div class="a-radio" data-a-input-name="ppw-instrumentRowSelection"><label for="pp-x-2"><input id="pp-x-2" name="ppw-instrumentRowSelection" type="radio" value="instrumentId=FAKE2&amp;isExpired=false&amp;paymentMethod=CC&amp;tfxEligible=false"/><i class="a-icon a-icon-radio"></i><span class="a-label a-radio-label"><span class="pmts-radio-label_hidden_text">Discover ending in 1111</span></span></label></div></span>
</div></div></div></div>
<div class="a-box-inner a-padding-small"><div class="a-fixed-left-grid"><div class="a-fixed-left-grid-inner"><div class="a-fixed-left-grid-col a-col-left">
<span class="pmts-instrument-selector"><div class="a-radio" data-a-input-name="ppw-instrumentRowSelection"><label for="pp-x-3"><input id="pp-x-3" name="ppw-instrumentRowSelection" type="radio" value="instrumentId=FAKE3&amp;isExpired=true&amp;paymentMethod=CC&amp;tfxEligible=false"/><i class="a-icon a-icon-radio"></i><span class="a-label a-radio-label"><span class="pmts-radio-label_hidden_text">Visa ending in 2222</span></span></label></div></span>
</div></div></div></div>
<div class="a-box-inner a-padding-small"><div class="a-fixed-left-grid"><div class="a-fixed-left-grid-inner"><div class="a-fixed-left-grid-col a-col-left">
<span class="pmts-instrument-selector"><div class="a-radio" data-a-input-name="ppw-instrumentRowSelection"><label for="pp-x-4"><input id="pp-x-4" name="ppw-instrumentRowSelection" type="radio" value="instrumentId=FAKE4&amp;isExpired=false&amp;paymentMethod=BA&amp;tfxEligible=false"/><i class="a-icon a-icon-radio"></i><span class="a-label a-radio-label"></span></label></div></span>
</div><div class="a-fixed-left-grid-col a-col-right">Bank Account ending in 12 Pat Checking</div></div></div></div>
<span class="a-button a-button-primary"><span class="a-button-inner"><input class="a-button-input" type="submit"/><span class="a-button-text">Use this payment method</span></span></span>
</form>
</body></html>
